# Lokale Entwicklungsumgebung. Produktion: ops/compose.yml (docs/BETRIEB.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vermieteros
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-kompatibel (MinIO veröffentlicht keine freien Images mehr). Zugang: dev / dev-geheim
  s3:
    image: rclone/rclone:1.71
    command: serve s3 --auth-key dev,dev-geheim --addr :9000 /data
    ports: ['9000:9000']
    volumes:
      - s3data:/data

  # Lokaler Mailserver für den Mail-Eingang: SMTP 3025, IMAP 3143, jede Anmeldung gilt
  mail:
    image: greenmail/standalone:2.1.5
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports: ['3025:3025', '3143:3143']

volumes:
  pgdata:
  s3data:
