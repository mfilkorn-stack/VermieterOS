# Lokale Entwicklungsumgebung. Produktion: Coolify auf Hetzner (docs/PLAN.md 7.2).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vermieteros
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports: ['9000:9000', '9001:9001']
    volumes:
      - miniodata:/data

  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ['3001:3000']

volumes:
  pgdata:
  miniodata:
